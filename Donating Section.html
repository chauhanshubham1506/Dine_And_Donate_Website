<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dine and Donate</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f8f5;
      color: #26372d;
    }

    header {
      background: #2f7654;
      color: white;
      text-align: center;
      padding: 28px 16px;
    }

    header h1 {
      margin: 0 0 6px;
      font-size: 30px;
    }

    header p {
      margin: 0;
      font-size: 15px;
      color: #e7f2eb;
    }

    main {
      width: min(680px, 92%);
      margin: 26px auto;
    }

    .card {
      background: white;
      border: 1px solid #e1e9e2;
      border-radius: 12px;
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: 0 3px 12px rgba(30, 70, 45, 0.06);
    }


.back-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            min-width: 190px;
            padding: 14px 25px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #ff8a00, #ff5e00);
            color: white;
            text-decoration: none;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 22px rgba(255, 94, 0, 0.24);
            transition: 0.25s ease;
        }


.back-btns {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            min-width: 190px;
            padding: 14px 25px;
            border: none;
            border-radius: 12px;
            background: black;
            color: white;
            text-decoration: none;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 22px rgba(255, 94, 0, 0.24);
            transition: 0.25s ease;
        }




.objective-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
        gap: 15px;
    }





    .card h2 {
      color: #2f7654;
      font-size: 20px;
      margin: 0 0 8px;
    }

    .intro {
      margin: 0;
      color: #637167;
      font-size: 14px;
    }

    .fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-top: 18px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .full { grid-column: 1 / -1; }

    label {
      font-size: 14px;
      font-weight: 600;
    }

    input, textarea {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #d3ded5;
      border-radius: 7px;
      background: #fcfdfc;
      color: #26372d;
      font: inherit;
      font-size: 14px;
    }

    input:focus, textarea:focus {
      outline: 2px solid #c6e3d1;
      border-color: #2f7654;
    }

    textarea {
      min-height: 82px;
      resize: vertical;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      border: 0;
      border-radius: 7px;
      padding: 11px 17px;
      font: inherit;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }


    #notice {
      color: #2f7654;
      font-size: 14px;
      margin-bottom: 0;
    }

    .quote {
      text-align: center;
    }

    .quote h2 { margin-bottom: 7px; }

    .quote p {
      margin: 0;
      color: #637167;
      font-size: 14px;
    }

    footer {
      text-align: center;
      color: #7a877e;
      font-size: 12px;
      padding: 0 16px 22px;
    }


.apple
{
back-color:linear-gradient(135deg, #fff9ed, #fff3d7);
}




    @media (max-width: 540px) {
      header h1 { font-size: 26px; }
      .fields { grid-template-columns: 1fr; }
      .full { grid-column: auto; }
      .card { padding: 18px; }
      .buttons { flex-direction: column; }
      button { width: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Dine and Donate ❤️</h1>
    <p>Share food. Spread kindness.</p>
  </header>

  <main>
    <section class="card">
      <h2>Food Donation Form</h2>
      <p class="intro">Enter the details below to arrange food collection.</p>

      <form id="donationForm">
        <div class="fields">
          <div class="field">
            <label for="restaurant">Restaurant Name</label>
            <input id="restaurant" name="restaurant" type="text" placeholder="Restaurant name" required>
          </div>

          <div class="field">
            <label for="food">Food Name</label>
            <input id="food" name="food" type="text" placeholder="Food items" required>
          </div>

          <div class="field">
            <label for="date">Collection Date</label>
            <input id="date" name="date" type="date" required>
          </div>

          <div class="field">
            <label for="time">Collection Time</label>
            <input id="time" name="time" type="time" required>
          </div>

          <div class="field full">
            <label for="address">Restaurant Address</label>
            <textarea id="address" name="address" placeholder="Enter complete address" required></textarea>
          </div>

          <div class="field full">
            <label for="message">Message (Optional)</label>
            <textarea id="message" name="message" placeholder="Any extra details about the donation"></textarea><br><br>
          </div>
        </div>
<section class="card">
<div class="objective-grid">


         <button type="reset" class="back-btns">Clear Form</button><br><br>
<a href="Donation.html"><input type="button" value="Cancel" class="back-btns"></a>

</div>
</section>  
      
<section class="card">
<div class="objective-grid">

    <a href="Dine And Donate Website.html">
<input type="button" value="Submit and back" class="back-btn"></a>
       
</div>
</section>  
      
        
      </form>
    </section>

    <section class="card quote">
      <h2>Dine with joy, donate with heart ❤️</h2>
      <p>Every meal can make a difference. Help reduce food waste and bring a smile to someone’s day.</p>
    </section>
  </main>

  <footer>Good food shared is kindness multiplied.</footer>

 
</body>
</html>
